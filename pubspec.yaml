name: code
description: "MoveCS è l’app che ti mostra tutte le fermate e gli orari dei bus di Cosenza in modo semplice e veloce. Consulta la mappa, trova le fermate vicine, guarda le prossime corse e pianifica i tuoi spostamenti in pochi secondi. Tutto ciò che ti serve per muoverti in città, sempre a portata di mano"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  localization: ^2.1.1
  flutter_localizations:
    sdk: flutter

  flutter:
    sdk: flutter
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
      - assets/icons/stop_icon.png
      - assets/icons/selected_stop_icon.png
      - assets/map_styles/map_style_light.json
      - assets/map_styles/map_style_dark.json
      - assets/translations/

  uses-material-design: true
